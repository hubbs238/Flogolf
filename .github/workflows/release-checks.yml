name: FLO release

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: flo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: FLO release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify the production candidate is the staged source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          STAGING_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$SOURCE_REPO" != "$GITHUB_REPOSITORY" || "$GITHUB_HEAD_REF" != staging ]]; then
            echo "::error::Open production releases from this repository's staging branch."
            exit 1
          fi
          if [[ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse "${STAGING_SHA}^{tree}")" ]]; then
            echo "::error::Merge main into staging, then redeploy and review the new staging revision."
            exit 1
          fi

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npx --no-install next typegen
      - run: npm run typecheck
      - run: node --import tsx scripts/verify-deployment.ts
      - run: node --import tsx scripts/verify-game.ts
      - run: node --import tsx scripts/audit-sheet.ts
      - run: node --import tsx scripts/explain-round.ts
      - run: node --import tsx scripts/verify-draft.ts

      - name: Confirm Vercel deployed this staging revision
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..36}; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$STAGING_SHA/status" \
              --jq '[.statuses[] | select(.context == "Vercel" and (.target_url // "" | startswith("https://vercel.com/hubbs238s-projects/flogolf/")))][0].state // "pending"')
            case "$state" in
              success) exit 0 ;;
              error|failure) echo "::error::Vercel reported $state for staging $STAGING_SHA."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Staging has no successful FLO Golf deployment for $STAGING_SHA. Check Vercel and rerun this job."
          exit 1
